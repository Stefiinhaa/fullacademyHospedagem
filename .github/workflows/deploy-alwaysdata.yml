
name: Deploy Fullacademy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fullacademy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALWAYSDATA_KNOWN_HOSTS }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Atualizar e compilar aplicação
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            fullacademy@ssh-fullacademy.alwaysdata.net \
            'bash ~/fullacademyHospedagem/backend/backend/deploy.sh'

      - name: Reiniciar site no Alwaysdata
        env:
          API_KEY: ${{ secrets.ALWAYSDATA_API_KEY }}
          SITE_ID: ${{ secrets.ALWAYSDATA_SITE_ID }}
        run: |
          set -eu
          curl --fail --silent --show-error \
            --request POST \
            --user "$API_KEY account=fullacademy:" \
            "https://api.alwaysdata.com/v1/site/$SITE_ID/restart/"
